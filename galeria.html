<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Galería</title>
  <link rel="stylesheet" href="styles/dj.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
</head>
<body>
<header>
  <div class="logo-container">
    <a href="dj.html" class="logo">MIGUEL VEGA DJ</a>
  </div>
  <nav class="navbar">
    <button class="menu-toggle" id="menu-toggle">&#9776;</button>
    <ul class="menu" id="menu">
      <li><a href="dj.html">Inicio</a></li>
      <li><a href="galeria.html">Galería</a></li>
      <li><a href="eventos.html">Eventos</a></li>
      <li><a href="produccion.html">Producción</a></li>
      <li><a href="contacto.html">Contacto</a></li>
    </ul>
  </nav>
</header>

  <section class="eventos-container">
    <h1>Galería</h1>
    <div class="carousel-container">
      <button class="carousel-btn left" onclick="scrollCarousel(-1)">&#8249;</button>
      <div class="carousel" id="galeriaCarousel">
        <!-- Se insertan las imágenes automáticamente -->
      </div>
      <button class="carousel-btn right" onclick="scrollCarousel(1)">&#8250;</button>
    </div>
  </section>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox">
    <span class="close">&times;</span>
    <button class="lightbox-btn prev" id="lightbox-prev" aria-label="Anterior">&#10094;</button>
    <img class="lightbox-content" id="lightbox-img" alt="Imagen ampliada">
    <button class="lightbox-btn next" id="lightbox-next" aria-label="Siguiente">&#10095;</button>
  </div>

  <footer>
  <p>&copy; 2026 MIGUEL VEGA. Todos los derechos reservados. <a href="politica-de-privacidad.html">Política de privacidad</a></p>
</footer>

  <script>
    const carousel = document.getElementById('galeriaCarousel');
    const totalImages = 15;
    const imagesList = [];

    for (let i = 1; i <= totalImages; i++) {
      const src = `images/galeria/img${i}.jpg`;
      imagesList.push(src);

      const card = document.createElement('div');
      card.className = 'event-card';
      card.innerHTML = `<img src="${src}" alt="Imagen ${i}" class="lightbox-img" data-index="${i - 1}">`;
      carousel.appendChild(card);
    }

    function scrollCarousel(direction) {
      const scrollAmount = 300;
      carousel.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
    }

    // Lightbox Logic
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const closeBtn = document.querySelector('.close');
    const prevBtn = document.getElementById('lightbox-prev');
    const nextBtn = document.getElementById('lightbox-next');

    let currentIndex = 0;

    function openLightbox(index) {
      currentIndex = index;
      lightboxImg.src = imagesList[currentIndex];
      lightbox.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.style.display = 'none';
      document.body.style.overflow = 'auto';
    }

    function showNextImage() {
      currentIndex = (currentIndex + 1) % imagesList.length;
      lightboxImg.src = imagesList[currentIndex];
    }

    function showPrevImage() {
      currentIndex = (currentIndex - 1 + imagesList.length) % imagesList.length;
      lightboxImg.src = imagesList[currentIndex];
    }

    document.addEventListener('click', function(e) {
      if (e.target.classList.contains('lightbox-img')) {
        const idx = parseInt(e.target.getAttribute('data-index'), 10);
        if (!isNaN(idx)) {
          openLightbox(idx);
        }
      }
    });

    closeBtn.addEventListener('click', closeLightbox);

    nextBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      showNextImage();
    });

    prevBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      showPrevImage();
    });

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) {
        closeLightbox();
      }
    });

    // Navegación por teclado (Flechas izq/der y Escape)
    document.addEventListener('keydown', (e) => {
      if (lightbox.style.display === 'flex') {
        if (e.key === 'ArrowRight') showNextImage();
        if (e.key === 'ArrowLeft') showPrevImage();
        if (e.key === 'Escape') closeLightbox();
      }
    });
  </script>
  <script>
  const toggle = document.getElementById('menu-toggle');
  const menu = document.getElementById('menu');

  toggle.addEventListener('click', () => {
    menu.classList.toggle('show');
  });

  // Cierra el menú al hacer clic en cualquier enlace
  document.querySelectorAll('.menu a').forEach(link => {
    link.addEventListener('click', () => {
      menu.classList.remove('show');
    });
  });
</script>
</body>
</html>
